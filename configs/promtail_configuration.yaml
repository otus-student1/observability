server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log

  - job_name: wordpress
    static_configs:
      - targets:
          - localhost
        labels:
          job: wordpress
          __path__: /var/www/wordpress/wp-content/debug.log # в cms  добавил функцию для дебага и пишущей части в этот файл + добавил несколько тестовых вызовов
